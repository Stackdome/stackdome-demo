name: Build and Push

on:
  push:
    branches: [main]
    paths:
      - 'hello-stack/**'
      - '.github/workflows/build-and-push.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        svc: [web, worker]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USER }}
          password: ${{ secrets.QUAY_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./hello-stack/${{ matrix.svc }}
          push: true
          tags: |
            quay.io/stackdome/hello-stack-${{ matrix.svc }}:latest
            quay.io/stackdome/hello-stack-${{ matrix.svc }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
